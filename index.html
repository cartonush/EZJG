<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243a">
  <meta name="description" content="אב טיפוס לחיפוש מכלולים לפי מערכת או פאנל, על בסיס נתוני הדגמה בלבד.">
  <title>EZJG · מאתר מכלולים</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeButton" aria-label="חזרה לדף הבית">
      <span class="brand-mark">EZ</span>
      <span><b>EZJG</b><small>מאתר מכלולים</small></span>
    </button>
    <button class="icon-button" id="installButton" hidden aria-label="התקנת האפליקציה">＋</button>
  </header>

  <main id="app" class="page-shell">
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">אב טיפוס · נתוני הדגמה בלבד</span>
        <h1>מוצאים את המכלול<br><em>בכמה לחיצות</em></h1>
        <p>חיפוש לפי פאנל או מערכת, עם פרטי כרך ו־JG.</p>
      </div>
      <div class="hero-mark" aria-hidden="true"><span>EZ</span><i></i><i></i><i></i></div>
    </section>

    <section class="data-banner" aria-live="polite">
      <span class="status-dot"></span>
      <span id="dataStatus">טוען נתוני הדגמה…</span>
      <button id="resetData" class="text-button" hidden>חזרה לנתוני הדגמה</button>
    </section>

    <section class="search-section" id="homeView">
      <div class="section-heading"><div><span class="eyebrow">בחר דרך חיפוש</span><h2>איך תרצה למצוא?</h2></div></div>
      <div class="mode-grid">
        <button class="mode-card panel-mode" data-mode="panel">
          <span class="mode-icon">▤</span><span class="mode-label">לפי פאנל</span>
          <span class="mode-hint">בחירת פאנל ואז מכלול</span><span class="mode-arrow">←</span>
        </button>
        <button class="mode-card system-mode" data-mode="system">
          <span class="mode-icon">⌘</span><span class="mode-label">לפי מערכת</span>
          <span class="mode-hint">בחירת מערכת ואז מכלול</span><span class="mode-arrow">←</span>
        </button>
      </div>
      <div class="quick-tools">
        <div><b>הטבלה שלך</b><span>אפשר לטעון קובץ Excel מעודכן</span></div>
        <label class="upload-button" for="excelFile">טעינת Excel <span>↑</span></label>
        <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" hidden>
      </div>
    </section>

    <section id="browseView" class="browse-section" hidden>
      <div class="breadcrumb"><button id="backHome" class="back-button">← <span>דף הבית</span></button><span>/</span><span id="modeCrumb"></span></div>
      <div class="section-heading browse-heading"><div><span class="eyebrow" id="browseEyebrow"></span><h2 id="browseTitle"></h2></div><span class="count-pill" id="choiceCount"></span></div>
      <div class="filter-wrap"><span>⌕</span><input id="choiceSearch" type="search" placeholder="חיפוש…" autocomplete="off"><button id="clearSearch" aria-label="ניקוי חיפוש" hidden>×</button></div>
      <div id="choiceList" class="choice-list"></div>
    </section>

    <section id="resultsView" class="results-section" hidden>
      <div class="breadcrumb"><button id="backChoices" class="back-button">← <span>חזרה לבחירה</span></button><span>/</span><span id="selectedCrumb"></span></div>
      <div class="section-heading browse-heading"><div><span class="eyebrow" id="resultsEyebrow"></span><h2 id="resultsTitle"></h2></div><span class="count-pill" id="resultCount"></span></div>
      <div id="resultList" class="result-list"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="תפריט ראשי">
    <button id="navHome" class="nav-item active"><span>⌂</span><small>ראשי</small></button>
    <button id="navPanels" class="nav-item"><span>▤</span><small>פאנלים</small></button>
    <button id="navSystems" class="nav-item"><span>⌘</span><small>מערכות</small></button>
    <button id="navData" class="nav-item"><span>▦</span><small>טבלה</small></button>
  </nav>

  <dialog id="detailDialog" class="detail-dialog">
    <button class="dialog-close" id="closeDialog" aria-label="סגירה">×</button>
    <span class="eyebrow">פרטי מכלול · נתוני הדגמה</span>
    <h2 id="detailName"></h2>
    <div class="detail-meta" id="detailMeta"></div>
    <button id="alternateView" class="alternate-button">מעבר לתצוגת מערכת <span>←</span></button>
  </dialog>

  <footer class="disclaimer">אב טיפוס להדגמה בלבד · אין להזין מידע מסווג או מבצעי</footer>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
